<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>暴力摩托 · 离线版</title>
<style>
*{box-sizing:border-box}html,body,main{margin:0;width:100%;height:100%;overflow:hidden;background:#070809;color:#fff;font:16px system-ui,sans-serif}
main{position:relative;display:grid;place-items:center}
#canvas{position:absolute;inset:0;margin:auto;display:block;width:100vw !important;height:100vh !important;max-width:none;outline:none;background:#000}
main.classic #canvas{width:min(100vw,133.333vh) !important;height:min(100vh,75vw) !important}
section{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:16px;padding:24px;text-align:center;background:#131518}
h1,p{margin:0}p{color:#cbcdd2}button{cursor:pointer;border:1px solid #777;border-radius:5px;background:#202226;color:#fff;font:inherit;padding:8px 14px}
#start{background:#e9f07a;color:#131518;border:0;font-weight:700;padding:11px 25px}
select{font:inherit;color:#fff;background:#202226;border:1px solid #777;border-radius:5px;padding:5px 8px}nav{position:absolute;top:0;right:0;display:flex;gap:5px;padding:8px;opacity:0}
nav:hover,nav:focus-within{opacity:1}nav button{font-size:14px} [hidden]{display:none !important}

#intro{display:flex;flex-direction:column;align-items:center;overflow-y:auto;gap:14px}
#intro[hidden]{display:none}
#intro h1{margin-top:auto}#intro .bindings{margin-bottom:auto}
.bindings{width:min(100%,660px);margin:0;padding:14px 18px;border:1px solid #414349;border-radius:8px;text-align:left}
.bindings h2{font-size:16px;margin:0 0 10px}
.bindings dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px;margin:0}
.bindings dl>div{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #33363a;padding:5px 0}
.bindings dd{margin:0;text-align:right}.bindings kbd{font:600 14px system-ui;color:#f2f2eb;white-space:nowrap}
.bindings .combat kbd{color:#e9f07a}
.bindings p{margin-top:12px;font-size:13px;line-height:1.5}
#status:empty{display:none}
@media(max-width:600px){.bindings dl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:390px){#intro{padding:14px}.bindings{padding:10px}.bindings dl{column-gap:12px}.bindings kbd{font-size:13px}}
#intro{overflow:auto;align-content:safe center}#relaySettings{font:14px system-ui;max-width:100%}#relaySettings summary{cursor:pointer}#relaySettings a{color:#e9f07a}#relaySettings input{max-width:100%}.room{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}.room input{width:8em;padding:.55em;text-align:center}.room button{font-size:15px}.playing{position:absolute;top:3px;left:6px;background:#141918dd;color:white;padding:4px 8px;pointer-events:none;font:14px system-ui;z-index:8}#roomStatus:empty{display:none}.touchMode {height:100%;height:100dvh;touch-action:none;overscroll-behavior:none;--edge:max(10px,2vmin);--key:clamp(48px,13vmin,70px)}
.touchMode #intro{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.touchMode #intro .bindings{display:none}
.touchMode #intro>p:last-child{margin-bottom:auto}
.touchMode #intro>*{flex-shrink:0}
.touchMode,.touchMode *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.touchMode input,.touchMode textarea,.touchMode [contenteditable="true"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.touchMode #canvas,.touchMode #touchPad,.touchMode #touchBack,.touchMode #tools button{touch-action:none}
.touchMode #tools{display:none}
.touchMode nav button,#touchBack{background:#141918bf;color:white;border-color:#c1c6ac80;font-size:13px;min-height:36px}
#touchBack{position:absolute;left:max(5px,env(safe-area-inset-left));top:max(4px,env(safe-area-inset-top))}
#touchPad{position:absolute;inset:0;touch-action:none}
#touchPad>div{position:absolute;bottom:max(var(--edge),env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,var(--key));gap:6px;pointer-events:none}
.driveKeys{left:max(var(--edge),env(safe-area-inset-left))}
.attackKeys{right:max(var(--edge),env(safe-area-inset-right))}
#touchPad button{pointer-events:auto;touch-action:none;padding:0;height:var(--key);border-radius:16px;background:#11191aca;color:#fff;border:1px solid #d8ded49c;text-shadow:0 1px 2px #000;font:700 clamp(13px,3.6vmin,17px) system-ui}
#touchPad .brake{grid-column:span 2;height:calc(var(--key)*.84)}
#touchPad button[data-held]{background:#e4eb91e6;color:#111;text-shadow:none}
@media(orientation:portrait){
 .touchMode{position:absolute;top:0;left:100%;width:100vh;width:100dvh;height:100vw;transform-origin:top left;transform:rotate(90deg)}
 .touchMode #canvas{width:100% !important;height:100% !important}
 .touchMode.classic #canvas{width:min(100%,133.333vw) !important;height:min(100%,75dvh) !important}
 .touchMode .driveKeys{left:max(var(--edge),env(safe-area-inset-top))}
 .touchMode .attackKeys{right:max(var(--edge),env(safe-area-inset-bottom))}
 .touchMode #touchBack{left:max(5px,env(safe-area-inset-top));top:max(4px,env(safe-area-inset-right))}
 .touchMode #touchPad>div{bottom:max(var(--edge),env(safe-area-inset-left))}
}
</style></head><body><main id="game"><canvas id="canvas" width="640" height="480" tabindex="0" aria-label="暴力摩托游戏画面"></canvas>
<section id="intro"><h1>暴力摩托</h1><button id="start">开始游戏</button><label>画质 <select id="quality"><option value="hd" selected>高清 · 1280×960</option><option value="fast">优先帧率 · 640×480</option><option value="classic">经典显示</option></select></label><p id="status" role="status"></p><div class="bindings"><h2>默认键位</h2>
<dl>
<div class="combat"><dt>出拳</dt><dd><kbd>U</kbd></dd></div>
<div class="combat"><dt>踢人</dt><dd><kbd>I</kbd></dd></div>
<div class="combat"><dt>重击</dt><dd><kbd>J</kbd></dd></div>
<div><dt>加油门</dt><dd><kbd>W</kbd></dd></div>
<div><dt>刹车</dt><dd><kbd>S</kbd></dd></div>
<div><dt>左 / 右转</dt><dd><kbd>A / D</kbd></dd></div>
<div><dt>左倾 / 右倾</dt><dd><kbd>Q / E</kbd></dd></div>
<div><dt>氮气加速</dt><dd><kbd>O</kbd></dd></div>
<div><dt>下车</dt><dd><kbd>F</kbd></dd></div>
<div><dt>菜单确认</dt><dd><kbd>Enter</kbd></dd></div>
<div><dt>返回 / 退出提示</dt><dd><kbd>Esc</kbd></dd></div>
<div><dt>移植版选项</dt><dd><kbd>F1</kbd></dd></div>
<div><dt>切换仪表盘</dt><dd><kbd>F10</kbd></dd></div>
</dl><p>氮气加速需要车辆支持。可在游戏内的「游戏设置 → 按键设置」查看或修改驾驶和攻击键。</p></div>
</section>
<nav id="tools" hidden><button id="aspect">原始 4:3</button><button id="full">全屏</button></nav><div id="touchPad" hidden>
  <div class="driveKeys" aria-label="驾驶">
    <button data-key="a" aria-label="左转">◀</button>
    <button data-key="d" aria-label="右转">▶</button>
    <button data-key="s" class="brake">后 / 刹车</button>
  </div>
  <div class="attackKeys" aria-label="动作">
    <button data-key="u">轻攻击</button><button data-key="j">重攻击</button>
    <button data-key="i">腿击</button><button data-key="o" hidden>氮气</button>
  </div>
</div>
<button id="touchBack" hidden>返回</button>
</main>

ey's Skoot-A-Rama","摩托车销售中心"],["Low discount prices. Pick up a killer sports bike, a monster super bike, or one of those junkpiles in the corner.","本店销售各种摩托，包括：废旧摩托车、运动型摩托车和超级跑车，品种繁多，任君选择。"],["Schmooze","闲谈"],["Let a fellow rider bend your ear a bit. Find out who's your friend and who hates your guts.","听一听其他车手的谈话，可以让你分辨出谁是朋友，谁是敌人。"],["Bulletin Board","开始比赛"],["Sign up for one of the happening races in the area.","准备启动摩托车进行比赛。"],["The Street","返回"],["Get ouuutta here!","返回到上一页面。"],["Rat Bikes","废旧摩托车"],["Mechanized rodents of the urban jungle, they squeak, they crawl, and they leave droppings behind. Nearly disposable, Rat Bikes are perfect for the frequent crasher.","这些摩托车已经残旧破损，即将报废。它们的特点是：声音响亮、速度慢、喷黑烟、在比赛中不能经受太\n多的撞击。"],["Sport Bikes","运动型摩托车"],["Featuring the fastest stock machines to hit the street, the Sport Bike class has something for everyone with a fat wallet and an addiction to blurred landscapes.","运动型摩托车作为街道中最灵活快速的机器，是每个有厚厚的钱夹并沉溺于模糊的美景的车手的最佳选择。"],["Super Bikes","超级跑车"],["The ultimate in high-tech exotic-ware, Super Bikes were conceived for the discerning few who favor functional insanity over more common strains of psychoses.","超级跑车是高科技的结晶，它们有速度快、能经受多次重大的撞击等特点，备受飚车族的青睐。"],["Load Game","载入游戏"],["Load a previously saved game from disk.","从磁盘载入一个以前保存下来的游戏进度。"],["Save Game","保存游戏"],["Save a game in progress to the current save file.","保存当前的游戏进度到一个现有的游戏进度文件。"],["Save Game As...","另存为..."],["Save a game in progress to disk.","把当前的游戏进度另存为一个新的游戏进度文件。"],["Game Mode","游戏模式"],["Toggle among Thrash Mode, Big Game Mode, and Mano-À-Mano Mode.","共有3个模式，分别是：练习模式、比赛模式和网络模式。"],["Race Resolution","屏幕分辩率"],["Run your race at the blazing speed of 320x240 or the stunning visual realism of 640x480.","选择运行游戏时的屏幕分辩率。"],["Player Level","游戏级别"],["Select the current level of play. The higher you go, the harder it gets.","选择游戏级别，级别越高，难度就越大。"],["Player Name","玩家名称"],["Select the name you wish to be known by.","输入你的姓名或呢称。"],["Select Character","选择人物"],["Choose the character you want ING: Average ACCELERATION: Romping TOP SPEED: Killer","它看起来很像法兰根斯坦的怪物。这个杀手级的二手摩托是由几辆损毁了的摩托车的散件组合而成的。\n售价：$%d\n马力：65 匹\n重量：390 磅\n操作性：一般\n加速度：乱蹦乱跳的\n最高速度：杀手级"],["The Italian-made Vampiro combines blazing speed and sharp handling in a bike that devastates the competition. $%d 90 HP/440 lbs HANDLING: Fluid ACCELERATION: Racy TOP SPEED: Blurring","这个意大利制造的联合收割机有强烈的速度和敏捷的操作性能，是一辆可以征服比赛的摩托。\n售价：$%d\n马力：90 匹\n重量：440 磅\n操作性：流畅\n加速度：有活力的\n最高速度：模糊"],["The ZYX 750 is much smoother and more stable than any competitive 750 on the road. $%d 100 HP/510 lbs HANDLING: Slow and Steady ACCELERATION: Hard TOP SPEED: Hara-kiri","这个 ZYX 摩托的操作性能比在路上的任何一辆 750 摩托都平滑和稳定。\n售价：$%d\n马力：100 匹\n重量：510 磅\n操作性：稳定\n加速度：快速\n最高速度：可观"],["Perhaps the best buy in the shop, the Aggressore is a superbly-balanced machine. $%d 75 HP/410 lbs HANDLING: Predictable ACCELERATION: Strong TOP SPEED: Competitive","该车的各项性价比都较好，特别是加速方面，是一辆稳定的摩托车。\n售价：$%d\n马力：75 匹\n重量：410 磅\n操作性：平庸\n加速度：强大\n最高速度：具有竞争力的"],["An extremely reliable heavyweight, the German-made DMG is a good mount for the Rasher who likes to brawl. $%d 120 HP/515 lbs HANDLING: Stable ACCELERATION: Moderate TOP SPEED: Hair-raising","德国制造的超级 DMG ，是专门为喜欢打架的车手而准备的极佳装备。\n售价：$%d\n马力：120 匹\n重量：515 磅\n操作性：稳定\n加速度：中等\n最高速度：飞扬"],["Socket-popping acceleration and surgical flickability: one of the slickest bikes in the world. $%d 75 HP/280 lbs HANDLING: Fidgety ACCELERATION: Socket-popping TOP SPEED: Blazing","爆炸性的的加速度和流畅的外形，一款世界上最漂亮的摩托车。\n售价：$%d\n马力：75 匹\n重量：280 磅\n操作性：令人烦躁的\n加速度：爆炸性的\n最高速度：强烈的"],["Middleweight on steroids, the Super Sport is Banzai's 1100 powerplant stuffed into a 750 chassis. $%d 140 HP/450 lbs HANDLING: Twitchy ACCELERATION: Explosive TOP SPEED: Fast!","体型上的中量级选手，1100 动力发动机塞满了 750 底盘的 Banzai 摩托是超级运动型摩托。\n售价：$%d\n马力：140 匹\n重量：450 磅\n操作性：不稳定的\n加速度：爆发性的\n最高速度：快速的"],["King of the Supers, the nitro Vipera is the most monstrous production bike ever to rule the road. $%d 160 HP/490 lbs HANDLING: Orgasmic ACCELERATION: Lethal TOP SPEED: Blinding","超级中的国王， th, you lose all qualifications for this level.","因为你违反了交通规则而被判即时入狱一个月，所以你失去了这次的比赛资格。"],["The cost of the fine for %s is $%d","这次罚款用了 %s 的金钱 $%d"],["You're outta money and outta luck! Game over, man!","你太倒霉啦！\nGAME OVER！"],["You're a loser, man. Better luck next time.","你已经输了，希望你下次会取得更好的成绩。"],["Whoa, you've qualified on every track in the level. Guess it's time to move on to bigger and better things.","你已经够资格参加每条赛道的下一级别的比赛。"],["%s finished in First Place.","%s 获得第一名。"],["%s finished in Second Place.","%s 获得第二名。"],["%s finished in Third Place.","%s 获得第三名。"],["Cancel","取消"],["OK","确定"],["GAME LOADING","正在载入游戏．．．"],["Get ready to race!","准备进行比赛！"],["Swap speakers","交换扬声器"],["Mute","静音"],["Master volume","主音量"],["Interface volume","界面音量"],["Game music","背景音乐"],["Sound effects","声音效果"],["Player's engine","玩家引擎"],["Other engines","其他引擎"],["Police siren","警笛"],["Buy","购买"],["Exit","退出"],["A.K.A.","代表"],["Chat Messages","聊天室"],["Enter some choice comments to scream at fellow rashers during a race.","输入一些精简的语句，这些语句将会在比赛期间显示。"],["%d players connected. Room for %d more.","%d 玩家已连接。Room for %d more."],["Delete","删除"],["Choose from 2 exciting tunes by Hammerbox","从 2 首令人振奋的乐曲中选择。\nHammerbox"],["Choose an exciting tune by Monster Magnet","选择 1 首令人振奋的乐曲。\nMonster Magnet"],["Choose from 3 exciting tunes by Paw","从 3 首令人振奋的乐曲中选择。\nPaw"],["Choose from 4 exciting tunes by Soundgarden","从 4 首令人振奋的乐曲中选择。\nSoundgarden"],["Choose from 2 exciting tunes by Swervedriver","从 2 首令人振奋的乐曲中选择。\nSwervedriver"],["Choose from 2 exciting tunes by Therapy?","从 2 首令人振奋的乐曲中选择。\nTherapy?"],["Change","更改"],["New","新建"],["Clear","清除"],["You're in the middle of a major rumble. Are you reeeally sure you want to go home and embarrass yourself in front of all your friends?","你已经在一场比赛中了，你确定想要退出而使你在所有朋友面前无地自容吗？"],["Accelerate","前进"],["Brake","刹车"],["Turn","转向"],["Lean","倾斜"],["Nitro boost","加速"],["Swing","拳打"],["Kick","脚踢"],["Backhand","重击"],["Dismount","下车"],["<Keyboard>","<键盘>"],["Joystick","操纵杆"],["Pedal","踏板 ary buffer","创建主缓冲失败。"],["AVI Device initialization failed","初始化 AVI 驱动失败。"],["Joystick Error","操纵杆错误"],["Cannot read joystick","不能读取操纵杆。"],["A change to the system configuration requires that all Telephony applications relinquish their use of Telephony before any can progress. Some have not yet done so.","更改一个系统配置必须放弃当前使用的电话应用程序。"],["Unable to use line","不能使用线路。"],["Line version unsupported by this app","线路的版本不支持这个应用。"],["Error on requested line","线路错误"],["The selected line doesn't support DATAMODEM capabilities","所选择的线路不支持 DATAMODEM 的数据流量。"],["The selected line doesn't support MAKECALL capabilities","所选择的线路不支持 MAKECALL 的数据流量。"],["Requested line is already in use","请求连接的线路正在使用。"],["This line doesn't support partial dialing.","这个线路不支持泛音拨号。"],["Dialing paused","已暂停拨号。"],["Unknown reason","未知原因"],["Remote party rejected call","远程游戏室拒绝你的呼叫。"],["Local phone picked up","本地电话已摘机。"],["Busy","占线"],["No answer","无响应"],["Bad address","无效地址"],["Unreachable","难以获得"],["Congestion","拥塞"],["Incompatible","不兼容"],["Unavailable","难以获得"],["No dial tone","无拨号音"],["Disconnected","已断开"],["Unable to translate phone number","不能识别电话号码。"],["One of the components of the Telephony device driver is missing. Use the Control Panel to set up the driver properly.","电话的设备驱动程序的一个组件已经丢失。\n请使用控制面板来适当地更新它的驱动程序。"],["You have two copies of the same Telephony driver installed. Use the Control Panel to remove one of the copies.","你已安装了两个相同的电话驱动程序。\n请使用控制面板来卸载其中的一个。"],["Out of memory; canceling action.","内存不足，正在取消这次操作。"],["TAPI operation failed for unknown reasons.","由于未知原因导致 TAPI 操作失败。"],["Unable to launch the Modem Control Panel","不能打开控制面板的调制解调器选项。"],["Closing existing call.","\n正在关闭当前的呼叫。"],["The selected line is incompatible with RoadRash","所选择的线路与暴力摩托车不兼容。"],["The selected line doesn't support the COMM/DATAMODEM device class","所选择的线路不支持 COMM 或 DATAMODEM 等类型的设备。"],["The name field must be non-NULL","名称这一项不能是空的。"],["Wait for the credit card bong tone","等待电话卡操作提示。"],["Wait for the second dial tone","等待第二拨号 const zhFormats=[];
const normalizeLabel=s=>s.replace(/[\s\u00a0]+/g,' ').trim();
for(const [key,value] of zhLabels){
 if(!key.includes('%')||!/[A-Za-z]{2}/.test(key))continue;
 const chunks=key.split(/(%[-\d.]*[sdiuf])/g);
 if(chunks.length===1)continue;
 const regex=chunks.map((s,i)=>i%2?'(.+?)':s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('');
 zhFormats.push([new RegExp('^'+regex+'$','i'),value]);
}
const zhDecoder=new TextDecoder();
const zhMasks=new Map();
const zhCtx=document.createElement('canvas').getContext('2d',{willReadFrequently:true});
const zhPal=new Map();
let zhInstance;
// Leave the original credits as soon as they appear on the first launch.
let startupCreditsPending=true;
function advanceStartupCredits(raw){
 if(!startupCreditsPending)return;
 if(raw==='Thrash Mode'){startupCreditsPending=false;return}
 if(!raw.includes('PC development team'))return;
 startupCreditsPending=false;
 setTimeout(()=>{
  const key={key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true,cancelable:true};
  canvas.dispatchEvent(new KeyboardEvent('keydown',key));
  setTimeout(()=>canvas.dispatchEvent(new KeyboardEvent('keyup',key)),80);
 },0);
}
function translated(raw){
 raceLan.install();raceRoom.label(raw);
 advanceStartupCredits(raw);
 const key=normalizeLabel(raw);
 if(!key || !/[A-Za-z]/.test(key))return null;
 const stats=key.match(/^Player\s*(\d+)\s+Level\s*(\d+)$/i);
 if(stats)return '玩家 '+stats[1]+'　　 等级 '+stats[2];
 const player=key.match(/^Player\s*(\d+)$/i);
 if(player)return '玩家 '+player[1];
 const direct=zhLabels.get(key);
 if(direct)return direct;
 const arrow=key.match(/^([^\w\s]{1,3})\s*(.+)$/);
 if(arrow&&zhLabels.has(arrow[2]))return '➜ '+zhLabels.get(arrow[2]);
 for(const [r,t] of zhFormats){
  const m=r.exec(key);
  if(m){
   let i=0;
   return t.replace(/%[-\d.]*[sdiuf]/g,()=>{const v=m[++i]||'';return zhLabels.get(v)||v});
  }
 }
 return null;
}
function textMask(text,size,bold){
 const tag=[size,+bold,text].join('|');
 if(zhMasks.has(tag))return zhMasks.get(tag);
 const font=(bold?'bold ':'')+size+'px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';
 zhCtx.font=font;
 const w=Math.max(1,Math.ceil(zhCtx.measureText(text).width)+2),h=size+5;
 zhCtx.canvas.width=w;zhCtx.canvas.height=h;zhCtx.font=font;zhCtx.textBaseline='top';
 zhCtx.fillText(text,0,1);
 const src=zhCtx.getImageData(0,0,w,h).data,pts=[];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(src[(y*w+x)*4+3]>=90)pts.push(y<<16|x);
 const mask={w:w-2,h,pts};if(zhMasks.size>1024)zhMasks.clear();zhMasks.set(tag,mask);return mask;
}
function drawChinese(mode,dc,a,b,c,d){
 if(!dc)return -1;
 const u=HEAPU8,i32=HEAP32;
 const ptr=mode?a:c;
 let n=mode?b:d;
 if(!ptr||ptr>=u.length)return -1;
 if(n<0){n=0;while(n<8192&&u[ptr+n])n++}
 if(n<=0||n>8192)return -1;
 const raw=zhDecoder.decode(u.subarray(ptr,ptr+n)).split('\0')[0];
 if(window.touchMenuDraw)window.touchMenuDraw(raw,mode,dc,a,b,c,d);
 const text=translated(raw);
 if(!text || !/[\u3400-\u9fff]/.test(text))return -1;
 const get=(p,off)=>i32[(p+off)>>2];
 const surface=get(dc,0);
 if(!surface)return -1;
 const depth=get(surface,12),sw=get(surface,16),sh=get(surface,20),pitch=get(surface,24),pixels=get(surface,28);
 if(!pixels||![8,16].includes(depth)||sw<1||sh<1)return -1;
 const fontHeight=Math.abs(get(dc,16))||14,bold=!!get(dc,24);
 let size=Math.max(10,Math.min(34,Math.round(fontHeight*0.77)));
 let x=mode?(c?get(c,0):0):a,y=mode?(c?get(c,4):0):b;
 const right=mode&&c?get(c,8):sw,bottom=mode&&c?get(c,12):sh,flags=mode?d:0;
 const maxWidth=right>x?right-x:sw;
 if(!(flags&16) && mode && c && maxWidth>5){
  while(size>9 && textMask(text,size,bold).w>maxWidth)size--;
 }
 const lines=[];
 for(const paragraph of text.replace(/\r/g,'').split('\n')){
  let line='';
  for(const ch of paragraph){
   if(mode && flags&16 && !(flags&32) && line.length && textMask(line+ch,size,bold).w>maxWidth){lines.push(line);line=''}
   line+=ch;
  }
  lines.push(line);
 }
 const advance=size+2,height=lines.length*advance;
 if(flags&1024){
  if(c){i32[(c+8)>>2]=x+Math.max(...lines.map(l=>textMask(l,size,bold).w));i32[(c+12)>>2]=y+height}
  return height;
 }
 if(flags&4)y+=Math.max(0,(bottom-y-height)>>1);else if(flags&8)y=bottom-height;
 const rgb=get(dc,4),r=rgb&255,g=(rgb>>>8)&255,blue=(rgb>>>16)&255;
 let color=((r>>3)<<10)|((g>>3)<<5)|(blue>>3);
 if(depth===8){
  if(!zhPal.has(rgb)){
   let best=0,score=Infinity;
   for(let k=0;k<256;k++){const pal=zhInstance.exports.zhPalette(k),diff=(r-(pal>>>16&255))**2+(g-(pal>>>8&255))**2+(blue-(pal&255))**2;if(diff<score){score=diff;best=k}}
   zhPal.set(rgb,best);
  }
  color=zhPal.get(rgb);
 }
 i32[(surface+40)>>2]=1;
 for(const line of lines){
  const {pts,w}=textMask(line,size,bold);
  const left=Math.max(0,(flags&1)?x+((maxWidth-w)>>1):(flags&2)?right-w:x);
  for(const point of pts){
   const xx=left+(point&65535),yy=y+(point>>>16);
   if(xx<0||xx>=sw||yy<0||yy>=sh)continue;
   const pos=pixels+pitch*yy+(depth===8?xx:2*xx);
   if(depth===8)u[pos]=color;else HEAPU16[pos>>1]=color;
  }
  y+=advance;
 }
 return height;
}

function showLoaded(file, bytes) {
  loadedBytes.set(file, bytes);
  const loaded = Array.from(loadedBytes.values()).reduce((a, b) => a + b, 0);
  const label = loaded === totalBytes ? '正在启动游戏…' :
    '正在加载 ' + (loaded / 1e6).toFixed(1) + ' / ' + (totalBytes / 1e6).toFixed(1) + ' MB';
  if (label !== previousLabel) by('status').textContent = previousLabel = label;
}

async function readPart(part) {
  const cache = await gameCache;
  const url = new URL(part.file, document.baseURI).href;
  const cached = cache && await cache.match(url).catch(() => null);
  if (cached) {
    const blob = await cached.blob().catch(() => null);
    if (blob && blob.size === part.size) {
      showLoaded(part.file, part.size);
      return blob;
    }
  }
  for (let attempt = 0; ; attempt++) {
    try {
      const response = await fetch(url, {cache: attempt ? 'reload' : 'default'});
      if (!response.ok) throw Error('HTTP ' + response.status);
      let blob;
      if (response.body && response.body.getReader) {
        const reader = response.body.getReader();
        const buffers = [];
        let bytes = 0;
        for (;;) {
          const {value, done} = await reader.read();
          if (done) break;
          buffers.push(value);
          bytes += value.byteLength;
          showLoaded(part.file, bytes);
        }
        blob = new Blob(buffers);
      } else {
        blob = await response.blob();
      }
      if (blob.size !== part.size) throw Error('数据下载不完整');
      showLoaded(part.file, blob.size);
      if (cache) await cache.put(url, new Response(blob)).catch(() => {});
      return blob;
    } catch (error) {
      if (attempt >= 3) throw error;
      showLoaded(part.file, 0);
      by('status').textContent = '连接中断，正在重试…';
      await new Promise(resolve => setTimeout(resolve, (attempt + 1) * 1000));
    }
  }
}

async function unpack(id) {
  const parts = gameFiles[id];
  const chunks = new Array(parts.length);
  let next = 0;
  async function download() {
    while (next < parts.length) {
      const index = next++;
      chunks[index] = await readPart(parts[index]);
    }
  }
  await Promise.all(Array.from({length: Math.min(2, parts.length)}, download));
  const stream = new Blob(chunks).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).arrayBuffer();
}
